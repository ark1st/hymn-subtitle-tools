name: Fetch WRC source pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/2026-wrc-guide-webapp-ls3mq2
    paths:
      - .github/workflows/fetch-wrc-sources.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source pages
        run: |
          mkdir -p wrc-2026-guide/sources
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          echo "== Notion 전체 블록 수집 =="
          npm install --no-save --no-fund --no-audit notion-client
          node wrc-2026-guide/sources/fetch-notion-full.mjs || true

          ls -la wrc-2026-guide/sources/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrc-2026-guide/sources
          git diff --cached --quiet || git commit -m "Fetch WRC source pages via Actions runner"
          git push
