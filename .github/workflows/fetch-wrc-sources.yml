name: Fetch WRC source pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/2026-wrc-guide-webapp-ls3mq2
    paths:
      - .github/workflows/fetch-wrc-sources.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source pages
        run: |
          mkdir -p wrc-2026-guide/sources
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          echo "== 시간표 PDF (weea 공지 첨부) =="
          curl -sL -A "$UA" -e "https://www.weea.kr/notice?mod=document&pageid=1&uid=31775" \
            "https://www.weea.kr/notice?pageid=1&uid=31775&action=kboard_file_download&kboard-file-download-nonce=c02be568a7&file=file1" \
            -o wrc-2026-guide/sources/2026-WRC-timetable.pdf -w "%{http_code}\n" || true
          file wrc-2026-guide/sources/2026-WRC-timetable.pdf || true

          echo "== 시간표 이미지 (공지 본문) =="
          curl -sL -A "$UA" \
            "https://www.weea.kr/wp-content/uploads/kboard_attached/25/202607/6a5785ff917a36090917.jpeg" \
            -o wrc-2026-guide/sources/2026-WRC-timetable.jpeg -w "%{http_code}\n" || true
          file wrc-2026-guide/sources/2026-WRC-timetable.jpeg || true

          echo "== Notion 전체 블록 수집 =="
          node wrc-2026-guide/sources/fetch-notion-full.mjs || true

          ls -la wrc-2026-guide/sources/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrc-2026-guide/sources
          git diff --cached --quiet || git commit -m "Fetch WRC source pages via Actions runner"
          git push
