name: Fetch WRC source pages

on:
  workflow_dispatch:
  push:
    branches:
      - claude/2026-wrc-guide-webapp-ls3mq2
    paths:
      - .github/workflows/fetch-wrc-sources.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source pages
        run: |
          mkdir -p wrc-2026-guide/sources
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          echo "== weea notice =="
          curl -sL -A "$UA" "https://www.weea.kr/notice?mod=document&pageid=1&uid=31775" \
            -o wrc-2026-guide/sources/weea-notice-31775.html -w "%{http_code}\n" || true

          echo "== wrc guide page =="
          curl -sL -A "$UA" "https://wrc.weea.kr/guide/kr.asp" \
            -o wrc-2026-guide/sources/wrc-guide-kr.html -w "%{http_code}\n" || true

          echo "== notion page via splitbee API =="
          curl -sL -A "$UA" "https://notion-api.splitbee.io/v1/page/64d8f9debf96824b88c781ec098ade2c" \
            -o wrc-2026-guide/sources/notion-page.json -w "%{http_code}\n" || true

          echo "== notion page raw HTML =="
          curl -sL -A "$UA" "https://violet-giant-b6c.notion.site/2026-WRC-64d8f9debf96824b88c781ec098ade2c" \
            -o wrc-2026-guide/sources/notion-page.html -w "%{http_code}\n" || true

          # weea 공지에 첨부된 PDF가 있으면 링크를 추출해 함께 받는다
          grep -oE 'href="[^"]*(kboard[^"]*file_download[^"]*|\.pdf[^"]*)"' wrc-2026-guide/sources/weea-notice-31775.html \
            | sed 's/href="//; s/"$//' | head -5 > /tmp/pdf_links.txt || true
          i=0
          while read -r link; do
            [ -z "$link" ] && continue
            case "$link" in
              http*) url="$link" ;;
              /*) url="https://www.weea.kr$link" ;;
              *) url="https://www.weea.kr/$link" ;;
            esac
            i=$((i+1))
            echo "attachment $i: $url"
            curl -sL -A "$UA" "$url" -o "wrc-2026-guide/sources/attachment-$i.bin" || true
          done < /tmp/pdf_links.txt

          ls -la wrc-2026-guide/sources/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrc-2026-guide/sources
          git diff --cached --quiet || git commit -m "Fetch WRC source pages via Actions runner"
          git push
