name: Deploy WRC guide to GitHub Pages

# wrc-2026-guide/ 내용이 바뀌면 gh-pages 브랜치로 동기화한다.
# (GITHUB_TOKEN으로는 Pages 사이트 생성 API를 쓸 수 없어 브랜치 방식을 사용)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/2026-wrc-guide-webapp-ls3mq2
    paths:
      - wrc-2026-guide/**
      - .github/workflows/deploy-pages.yml

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p /tmp/site
          cp -r wrc-2026-guide/. /tmp/site/
          rm -rf /tmp/site/sources
          touch /tmp/site/.nojekyll

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rf --quiet .
          cp -r /tmp/site/. .
          git add -A
          git commit -m "Deploy 2026 WRC guide to GitHub Pages ($GITHUB_SHA)"
          git push origin gh-pages-new:gh-pages --force
